schema_version: 1.0.0
research:
  title: Pourquoi Bitcoin n’a-t-il pas de valeur fondamentale évidente ?
  subtitle: Valoriser un actif sans dividende, sans coupon et sans flux de trésorerie.
  source_of_truth: research_spec.md
  objective: Tester si les principaux ancrages économiques proposés pour Bitcoin produisent des relations
    de valorisation stables, robustes et utilisables hors échantillon.
  causal_claims_allowed_without_identification: false
sample:
  requested_daily_start: '2017-08-17'
  daily_cutoff_exclusive: '2026-09-16'
  primary_frequency: monthly
  primary_monthly_start: 2017-09
  primary_monthly_end: 2026-08
  expected_primary_months: 108
  base_currency: USD
sample_policy:
  primary_monthly_sample: complete_calendar_months_only
  partial_months: exclude
  interpolation_allowed: false
  forward_fill_allowed: false
  backward_fill_allowed: false
  silent_row_drop_allowed: false
  model_specific_missingness: allowed_and_reported
  common_sample_comparison: true
notation:
  market_price: P_t
  model_implied_value: Vhat_t_m
  valuation_gap_formula: log(Vhat_t_m / P_t)
  valuation_gap_positive_meaning: model_implied_value_above_market_price
  valuation_gap_negative_meaning: model_implied_value_below_market_price
  log_error_formula: log(P_t) - log(Vhat_t_m)
model_scope:
  scarcity:
    enabled: true
    primary: true
    specification: log_price_on_log_stock_to_flow
  adoption:
    enabled: false
    primary: false
    reason: predeclared_primary_proxy_unavailable
    predeclared_proxy: AdrNewBalCnt
    availability_result: not_available_on_coinmetrics_community
    substitution_allowed: false
  network:
    enabled: true
    primary: true
    proxy: AdrActCnt
    specification: log_market_cap_on_log_network_proxy
    literal_metcalfe_exponent: 2.0
    test_literal_metcalfe: true
  production_cost:
    enabled: true
    primary: true
    anchor: electricity_cost_per_btc
    interpretation: electricity_cost_anchor_not_full_miner_break_even
  gold:
    enabled: true
    primary: true
    method: scenario_analysis_only
    regression_model: false
market_price:
  treated_as_fundamental_model: false
  role: benchmark_and_observed_market_price
monthly_aggregation:
  btc_price_usd: last_available_daily_close
  btc_supply_current: last_available_daily_observation
  btc_active_addresses: monthly_mean
  btc_hashrate: monthly_mean
  production_cost_electricity_usd_per_btc: monthly_mean
  stock_to_flow: computed_at_month_end_from_trailing_365_day_flow
derived_variables:
  market_cap:
    formula: btc_price_usd * btc_supply_current
  flow_365d:
    formula: btc_supply_current_t - btc_supply_current_t_minus_365d
  stock_to_flow:
    formula: btc_supply_current / flow_365d
  log_price:
    formula: log(btc_price_usd)
  log_market_cap:
    formula: log(market_cap)
  log_active_addresses:
    formula: log(btc_active_addresses)
scarcity_model:
  dependent_variable: log_btc_price
  explanatory_variable: log_stock_to_flow
  equation: log(P_t) = alpha + beta * log(SF_t) + epsilon_t
  warnings:
  - nonstationarity
  - spurious_regression
  - deterministic_halving_structure
  - few_effective_protocol_events
  high_r_squared_sufficient_evidence: false
network_model:
  dependent_variable: log_btc_market_cap
  explanatory_variable: log_active_addresses
  equation: log(MarketCap_t) = alpha + beta * log(N_t) + epsilon_t
  literal_metcalfe_null:
    parameter: beta
    null_value: 2.0
  address_equals_unique_user: false
production_cost_model:
  output_unit: USD_per_BTC
  electricity_price_usd_per_kwh: 0.05
  annualisation_days: 365.25
  reward_formula: IssTotNtv + FeeTotNtv
  reward_smoothing:
    method: trailing_arithmetic_mean
    window_days: 7
    minimum_periods: 7
    warmup_days: 6
  cbeci_input: annualised consumption GUESS, TWh
  cbeci_additional_smoothing: false
  formula: ((cbeci_twh_per_year * 1e9 * 0.05) / 365.25) / reward_ma7_btc
  exclusions:
  - ASIC_depreciation
  - facility_rent
  - labour
  - other_operating_costs
  structural_causality_claim: false
  endogeneity_warning: price_may_influence_hashrate_difficulty_and_cost
gold_model:
  observation_date: '2026-06-30'
  btc_supply_alignment_date: '2026-06-30'
  reported_gold_market_value_usd_trillion: 29.0
  reported_above_ground_stock_tonnes: 222600
  theta_grid:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 1.0
  formula: theta * gold_market_value / btc_supply
  sensitivity_formula: gold_market_value / btc_supply
  use_for_cointegration: false
  use_for_predictive_regression: false
diagnostics:
  pre_regression:
    plot_level: true
    plot_log: true
    plot_first_difference: true
    acf: where_relevant
    pacf: where_relevant
    adf: true
    kpss: true
    outliers: true
    variance_changes: true
  integration_order:
    classify_I0_I1: true
    conflicting_tests_must_be_reported: true
cointegration:
  primary_method: engle_granger_bivariate
  apply_when_both_series_I1: true
  residual_stationarity_required: true
  high_r_squared_without_stationary_residuals_valid: false
  small_sample_warning: true
  structural_break_warning: true
out_of_sample:
  enabled: true
  scheme: strict_expanding_window
  rule: estimate_parameters_through_t_minus_1_then_construct_value_at_t
  own_price_used_to_fit_own_implied_value: false
  rolling_window:
    primary: false
    robustness_only: true
    post_hoc_window_optimization_allowed: false
baselines:
  previous_market_price:
    enabled: true
    formula: P_t_minus_1
  rolling_historical_log_price_mean:
    enabled: true
evaluation_metrics:
- MAE
- RMSE
- bias
- median_absolute_error
parameter_stability:
  rolling_coefficients: true
  rolling_confidence_intervals: true
  chow_test:
    enabled: true
    break_dates_must_be_economically_predefined: true
  multiple_break_detection:
    enabled: true
    method: bai_perron_or_equivalent
predictive_regressions:
  enabled: true
  dependent_variable: forward_log_return
  predictor: valuation_gap
  equation: R_t_to_t_plus_h = alpha_h + beta_h * gap_t + epsilon_t_plus_h
  horizons_months:
  - 3
  - 6
  - 12
  - 24
  null_hypothesis: beta_h = 0
  null_result_is_valid: true
inference:
  hac:
    enabled: true
    method: newey_west
    minimum_lag_rule: horizon_minus_one_for_overlapping_forward_returns
  block_bootstrap:
    enabled: true
    repetitions: 5000
    block_length_selection: pre_model_data_driven
  small_effective_sample_warning: true
multiple_testing:
  primary_family_adjustment:
    enabled: true
    method: holm
    control: FWER
  report_unadjusted_pvalues: true
  conclusions_follow_adjusted_pvalues: true
  exploratory_tests_must_be_labelled: true
regime_robustness:
  enabled: true
  hidden_state_model_allowed_in_this_study: false
  regime_definition: observable_trend_and_realized_volatility
  number_of_regimes: 4
  use: descriptive_robustness_only
  metric: MAE_by_regime
sensitivity:
  scarcity:
  - flow_definition
  network:
  - network_proxy
  - beta_assumption
  production_cost:
  - electricity_price
  - cost_scope
  gold:
  - theta
  distinguish_data_information_from_analyst_assumptions: true
falsification:
  weaken_model_if:
  - required_long_run_relation_absent
  - coefficients_unstable
  - result_depends_on_single_subperiod
  - out_of_sample_performance_not_better_than_naive_baselines
  - result_fragile_to_reasonable_method_changes
  - result_disappears_after_multiple_testing_adjustment
  - result_excessively_driven_by_imposed_assumptions
  preserve_negative_results: true
figures:
- id: 1
  name: traditional_cashflow_anchor_diagram
- id: 2
  name: candidate_economic_variables
- id: 3
  name: market_price_vs_model_implied_values_log_scale
- id: 4
  name: valuation_gaps
- id: 5
  name: rolling_coefficients
- id: 6
  name: out_of_sample_errors
- id: 7
  name: gold_scenario_sensitivity
- id: 8
  name: valuation_gap_vs_12m_forward_return
editorial:
  target: public_quantitative_research_newsletter
  complexity_for_display_only: false
  causal_language_without_identification: false
  distinguish_contemporaneous_from_predictive_relationships: true
  distinguish_model_implied_value_from_true_fundamental_value: true
  likely_conclusion_must_not_be_forced: true
reproducibility:
  raw_data_immutable: true
  preserve_source_snapshots: true
  sha256_manifests: true
  frozen_before_model_results: true
  model_results_may_change_protocol: false
stationarity_tests:
  significance_level: 0.05
  series:
  - log_btc_price
  - log_btc_market_cap
  - log_active_addresses
  - log_production_cost_electricity
  - log_stock_to_flow
  levels:
    adf:
      regression: ct
      autolag: AIC
    kpss:
      regression: ct
      nlags: auto
  first_differences:
    adf:
      regression: c
      autolag: AIC
    kpss:
      regression: c
      nlags: auto
  classification:
    I0: level_adf_reject_and_level_kpss_not_reject
    I1: level_adf_not_reject_and_level_kpss_reject_and_diff_adf_reject_and_diff_kpss_not_reject
    otherwise: inconclusive
  acf_pacf:
    enabled: true
    max_lags: 24
  plots:
    level: true
    first_difference: true
    acf: true
    pacf: true

descriptive_relationships:
  status: "preregistered_after_stationarity_before_regression_results"
  interpretation: "descriptive_not_cointegrating_evidence"

  models:
    scarcity:
      dependent: "log_btc_price"
      explanatory: "log_stock_to_flow"

    network:
      dependent: "log_btc_market_cap"
      explanatory: "log_active_addresses"

    production_cost:
      dependent: "log_btc_price"
      explanatory: "log_production_cost_electricity"

  level_regression:
    enabled: true
    estimator: "OLS"
    covariance: "HAC"
    hac_maxlags: 6
    causal_interpretation: false
    cointegration_interpretation: false

  first_difference_regression:
    enabled: true
    estimator: "OLS"
    covariance: "HAC"
    hac_maxlags: 6

  residual_diagnostics:
    ljung_box_lags:
      - 6
      - 12

  rolling_coefficients:
    enabled: true
    window_months: 36
    optimize_window_after_results: false

  figures:
    scatter_level: true
    fitted_level_time_series: true
    residual_level: true
    rolling_beta: true

  structural_break_tests:
    run_in_this_stage: false

  engle_granger:
    run_in_this_stage: false

  valuation_gap:
    run_in_this_stage: false

  out_of_sample:
    run_in_this_stage: false

structural_stability:
  status: "preregistered_after_descriptive_diagnostics_before_break_results"
  interpretation: "parameter_stability_diagnostics"

  stages:
    - "level"
    - "first_difference"

  predefined_breaks:
    convention: "first_complete_month_after_halving"
    months:
      - "2020-06"
      - "2024-05"

  predefined_tests:
    classical_chow:
      enabled: true
      interpretation: "descriptive_due_to_serial_correlation_risk"

    hac_interaction_wald:
      enabled: true
      primary: true
      covariance: "HAC"
      hac_maxlags: 6
      null: "intercept_and_slope_unchanged_across_break"

  multiplicity:
    method: "holm"
    alpha: 0.05
    family: "all_predefined_hac_wald_tests"

  unknown_breaks:
    enabled: true
    method: "dynamic_programming_segmented_ols"
    interpretation: "bai_perron_equivalent_break_location_diagnostic"
    max_breaks: 3
    min_segment_months: 18
    selection: "BIC"
    bic_formula: "n*log(RSS/n)+k*log(n)"
    parameter_count_formula: "2*segments+breaks"
    causal_interpretation: false
    redefine_primary_sample: false

  restrictions:
    cointegration_claim: false
    causal_claim: false
    use_detected_breaks_to_redefine_primary_tests: false

oos_valuation:
  status: "preregistered_before_oos_results"
  interpretation: "strict_expanding_pseudo_out_of_sample_valuation"

  estimation:
    method: "OLS"
    window: "expanding"
    minimum_training_observations: 36
    parameters_estimated_through: "t_minus_1"
    contemporaneous_x_t_allowed: true
    price_t_used_in_parameter_estimation: false
    structural_breaks_used_to_reset_estimation: false
    hyperparameter_tuning: false

  models:
    scarcity:
      dependent: "log_btc_price"
      explanatory: "log_stock_to_flow"
      output_transform: "direct_log_price"
      expected_first_target_month: "2021-08"
      expected_oos_observations: 61

    network:
      dependent: "log_btc_market_cap"
      explanatory: "log_active_addresses"
      output_transform: "log_market_cap_minus_log_supply"
      expected_first_target_month: "2020-09"
      expected_oos_observations: 72

    production_cost:
      dependent: "log_btc_price"
      explanatory: "log_production_cost_electricity"
      output_transform: "direct_log_price"
      expected_first_target_month: "2020-09"
      expected_oos_observations: 72

  baselines:
    previous_price:
      formula: "log_P_t_minus_1"

    expanding_historical_log_price_mean:
      formula: "mean_log_P_using_all_primary_months_through_t_minus_1"

  evaluation:
    primary_scale: "log_price"
    error_definition: "actual_minus_model_implied"
    metrics:
      - "MAE"
      - "RMSE"
      - "bias"
      - "MedAE"

    model_specific_samples: true
    common_sample: true
    expected_common_first_month: "2021-08"
    expected_common_last_month: "2026-08"
    expected_common_observations: 61

  data_vintage:
    classification: "pseudo_out_of_sample"
    realtime_vintage_claim: false
    note: "Historical source series were retrieved from 2026 snapshots and may contain revisions."

  restrictions:
    causal_claim: false
    trading_backtest_claim: false
    realtime_forecast_claim: false
    cointegration_claim: false

oos_comparison_inference:
  status: "preregistered_before_loss_differential_inference"

  sample:
    type: "common_oos_only"
    expected_first_month: "2021-08"
    expected_last_month: "2026-08"
    expected_observations: 61

  benchmark:
    estimator: "previous_price"

  models:
    - "scarcity"
    - "network"
    - "production_cost"

  loss_functions:
    absolute_error:
      formula: "abs(actual_log_price - predicted_log_price)"

    squared_error:
      formula: "(actual_log_price - predicted_log_price)^2"

  loss_differential:
    formula: "model_loss - benchmark_loss"
    positive_meaning: "model_worse_than_previous_price"

  hac_mean_test:
    enabled: true
    null: "mean_loss_differential_equals_zero"
    alternative_reporting: "two_sided"
    maxlags: 6

  block_bootstrap:
    enabled: true
    method: "moving_block_bootstrap"
    replications: 5000
    random_seed: 20260917
    block_length_rule: "ceil(n^(1/3))"
    expected_block_length_for_n_61: 4
    confidence_level: 0.95
    interval: "percentile"

  multiplicity:
    method: "holm"
    alpha: 0.05
    family: "all_3_models_x_2_loss_functions"

  restrictions:
    model_ranking_claim_from_point_estimate_only: false
    realtime_forecast_claim: false
    causal_claim: false

gap_predictive_returns:
  status: "preregistered_before_predictive_results"
  interpretation: "predictive_association_not_causality"

  source:
    valuation_gap: "frozen_expanding_pseudo_oos_valuation"
    reestimate_valuation_models: false

  gap:
    formula: "model_log_price - actual_log_price"
    equivalent: "log(model_implied_value / observed_price)"
    positive_meaning: "model_implied_value_above_market"

  forward_return:
    formula: "log_P_t_plus_h - log_P_t"
    horizons_months:
      - 3
      - 6
      - 12
      - 24

  regression:
    formula: "forward_log_return = alpha_h + beta_h * valuation_gap + error"
    estimator: "OLS"
    covariance: "HAC"
    hac_maxlags_rule: "h_minus_1"
    causal_interpretation: false

  samples:
    primary: "model_specific"
    common_sample_robustness: true

    expected_primary_observations:
      scarcity:
        "3": 58
        "6": 55
        "12": 49
        "24": 37
      network:
        "3": 69
        "6": 66
        "12": 60
        "24": 48
      production_cost:
        "3": 69
        "6": 66
        "12": 60
        "24": 48

    expected_common_observations:
      "3": 58
      "6": 55
      "12": 49
      "24": 37

  block_bootstrap:
    enabled: true
    method: "circular_block_pairs_bootstrap"
    replications: 5000
    random_seed: 20260917
    block_length_rule: "max(h, ceil(n^(1/3)))"
    confidence_level: 0.95
    interval: "percentile"

  multiplicity:
    primary_family:
      method: "holm"
      alpha: 0.05
      number_of_tests: 12
      family: "3_models_x_4_horizons"

  restrictions:
    realtime_forecast_claim: false
    causal_claim: false
    fundamental_value_claim_from_predictive_beta: false
    shared_current_price_component_acknowledged: true
    common_sample_results_are_robustness: true

gap_shared_price_falsification:
  status: "post_primary_results_robustness"
  interpretation: "shared_current_price_component_falsification"
  primary_result_override_allowed: false

  source:
    forecasts: "frozen_expanding_pseudo_oos_valuation"
    reestimate_valuation_models: false

  components:
    naive_gap:
      formula: "previous_price_log - actual_log_price"
      interpretation: "price_only_shared_component"

    excess_model_gap:
      formula: "model_log_price - previous_price_log"
      interpretation: "model_specific_component_beyond_previous_price"

  forward_return:
    formula: "log_P_t_plus_h - log_P_t"
    horizons_months:
      - 3
      - 6
      - 12
      - 24

  regressions:
    price_only:
      formula: "forward_return = alpha + gamma * naive_gap + error"

    incremental:
      formula: "forward_return = alpha + gamma * naive_gap + beta_excess * excess_model_gap + error"
      parameter_of_interest: "beta_excess"

  inference:
    estimator: "OLS"
    covariance: "HAC"
    hac_maxlags_rule: "h_minus_1"

  multiplicity:
    incremental_beta_family:
      method: "holm"
      alpha: 0.05
      number_of_tests: 12

  restrictions:
    causal_claim: false
    fundamental_value_claim: false
    robustness_only: true

gold_scenario:
  status: "preregistered_before_scenario_results"
  interpretation: "scenario_sensitivity_not_fundamental_value_model"

  observation_date: "2026-06-30"

  gold_input:
    provider: "World Gold Council"
    use_certified_snapshot: true
    market_value_field: "reported_market_value_usd_trillion"
    expected_market_value_usd_trillion: 29.0
    precision: "reported_rounded_snapshot"

  bitcoin_input:
    use_certified_monthly_panel: true
    supply_field: "btc_supply_current"
    price_field: "btc_price_usd"
    alignment_date: "2026-06-30"

  scenarios:
    gold_market_share:
      - 0.05
      - 0.10
      - 0.25
      - 0.50
      - 1.00

  formulas:
    implied_market_cap: "theta * gold_market_value_usd"
    implied_btc_price: "implied_market_cap / btc_supply"
    price_multiple: "implied_btc_price / observed_btc_price"
    log_gap: "log(implied_btc_price / observed_btc_price)"
    spot_gold_share: "observed_btc_market_cap / gold_market_value_usd"

  restrictions:
    regression: false
    statistical_inference: false
    predictive_claim: false
    causal_claim: false
    intrinsic_value_claim: false
    fundamental_value_claim: false
