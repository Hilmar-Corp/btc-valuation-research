name: Dependency and SBOM controls

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict --progress-spinner off

      - name: Generate CycloneDX SBOM
        run: pip-audit -r requirements.txt --format cyclonedx-json --output sbom.cdx.json --progress-spinner off

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bitcoin-valuation-research-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
